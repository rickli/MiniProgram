<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>编辑页布局设计方案</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .grid { display: flex; gap: 40px; flex-wrap: wrap; justify-content: center; }
        .phone-mockup { width: 340px; height: 680px; background: #fff; border: 12px solid #333; border-radius: 40px; position: relative; overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.15); }
        .screen { height: 100%; display: flex; flex-direction: column; overflow-y: auto; background: #fff; }
        .nav-bar { height: 44px; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 16px; border-bottom: 1px solid #eee; background: #fff; }
        .section-title { font-size: 11px; color: #bbb; margin: 15px 20px 8px; text-transform: uppercase; letter-spacing: 2px; font-weight: 600; }

        /* 方案 A: 极简留白 */
        .style-a { background: #fff; }
        .style-a .info { padding: 40px 25px; }
        .style-a .time { font-size: 32px; font-weight: 200; color: #111; margin-bottom: 8px; }
        .style-a .loc { font-size: 13px; color: #888; display: flex; align-items: center; }
        .style-a .mood-row { display: flex; justify-content: space-between; padding: 15px 25px; }
        .style-a .mood-item { font-size: 26px; padding: 12px; border-radius: 50%; background: #fcfcfc; transition: all 0.3s; }
        .style-a .mood-item.active { background: #fff; box-shadow: 0 4px 15px rgba(0,0,0,0.05); transform: translateY(-3px); border: 1px solid #eee; }
        .style-a .note-area { padding: 10px 25px; font-size: 15px; min-height: 120px; color: #444; line-height: 1.8; border: none; outline: none; resize: none; width: calc(100% - 50px); }
        .style-a .save-btn { position: absolute; bottom: 40px; left: 25px; right: 25px; height: 54px; background: #111; color: #fff; border-radius: 27px; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 15px; letter-spacing: 1px; }

        /* 方案 B: 沉浸式卡片 */
        .style-b .screen { background: #f4f5f7; padding: 20px; box-sizing: border-box; }
        .style-b .diary-card { background: #fff; border-radius: 28px; height: 100%; box-shadow: 0 15px 45px rgba(0,0,0,0.06); display: flex; flex-direction: column; overflow: hidden; position: relative; }
        .style-b .header-img { height: 140px; background: linear-gradient(135deg, #07c160 0%, #00b0ff 100%); padding: 30px 25px; box-sizing: border-box; color: #fff; }
        .style-b .header-time { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
        .style-b .header-loc { font-size: 12px; opacity: 0.9; display: flex; align-items: center; }
        .style-b .content-body { padding: 25px; flex: 1; }
        .style-b .mood-selector { display: flex; justify-content: space-between; margin-bottom: 30px; }
        .style-b .mood-opt { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; font-size: 24px; border-radius: 14px; background: #f8f9fb; transition: all 0.2s; }
        .style-b .mood-opt.active { background: #07c160; box-shadow: 0 8px 20px rgba(7,193,96,0.25); transform: scale(1.15); }
        .style-b .text-input { font-size: 15px; color: #333; line-height: 1.8; border-left: 3px solid #eee; padding-left: 15px; margin-bottom: 30px; font-style: italic; color: #666; }
        .style-b .photo-section { display: flex; gap: 12px; }
        .style-b .photo-add { width: 80px; height: 80px; background: #f8f9fb; border: 1.5px dashed #ddd; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #aaa; font-size: 28px; }
        .style-b .save-fab { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); width: 160px; height: 48px; background: #07c160; color: #fff; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; box-shadow: 0 10px 25px rgba(7,193,96,0.3); }

        /* 方案 C: 叙事流风格 */
        .style-c .screen { padding: 0 0 40px 0; }
        .style-c .timeline-wrapper { padding: 30px 25px; position: relative; }
        .style-c .vertical-line { position: absolute; left: 35px; top: 40px; bottom: 0; width: 2px; background: #f0f0f0; }
        .style-c .flow-item { display: flex; margin-bottom: 40px; position: relative; z-index: 1; }
        .style-c .marker { width: 12px; height: 12px; background: #07c160; border-radius: 50%; border: 4px solid #fff; margin-top: 5px; margin-right: 20px; box-shadow: 0 0 0 2px #f0f0f0; }
        .style-c .content { flex: 1; }
        .style-c .f-time { font-size: 12px; color: #bbb; margin-bottom: 4px; font-weight: 600; }
        .style-c .f-title { font-size: 16px; font-weight: 700; color: #333; margin-bottom: 10px; }
        .style-c .f-mood { font-size: 32px; }
        .style-c .f-note { font-size: 14px; color: #555; line-height: 1.7; background: #f9f9f9; padding: 15px; border-radius: 12px; }
        .style-c .f-photo { width: 100%; height: 180px; background: #f0f0f0; border-radius: 16px; display: flex; align-items: center; justify-content: center; color: #ccc; font-size: 30px; }
        .style-c .bottom-save { position: sticky; bottom: 20px; margin: 0 25px; height: 50px; background: #07c160; color: #fff; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: 600; box-shadow: 0 8px 20px rgba(7,193,96,0.2); }

        .label-tag { text-align: center; font-weight: bold; margin-bottom: 10px; color: #555; font-size: 18px; }
    </style>
</head>
<body>
    <div class="grid">
        <!-- 方案 A -->
        <div>
            <div class="label-tag">方案 A：极简留白</div>
            <div class="phone-mockup style-a">
                <div class="screen">
                    <div class="nav-bar">时刻编辑</div>
                    <div class="info">
                        <div class="time">21:40</div>
                        <div class="loc">📍 上海市静安区延安中路</div>
                    </div>
                    <div class="section-title">此刻心情</div>
                    <div class="mood-row">
                        <div class="mood-item">😊</div>
                        <div class="mood-item">😢</div>
                        <div class="mood-item active">🏖️</div>
                        <div class="mood-item">💼</div>
                        <div class="mood-item">🔥</div>
                    </div>
                    <div class="section-title">手记</div>
                    <textarea class="note-area" readonly>记录这一刻的想法...</textarea>
                    <div class="save-btn">保存时刻</div>
                </div>
            </div>
        </div>

        <!-- 方案 B -->
        <div>
            <div class="label-tag">方案 B：沉浸式卡片</div>
            <div class="phone-mockup style-b">
                <div class="screen">
                    <div class="diary-card">
                        <div class="header-img">
                            <div class="header-time">2026.03.27 21:40</div>
                            <div class="header-loc">📍 正在获取地址...</div>
                        </div>
                        <div class="content-body">
                            <div class="section-title" style="margin-left:0">此刻心情</div>
                            <div class="mood-selector">
                                <div class="mood-opt">😊</div>
                                <div class="mood-opt">😢</div>
                                <div class="mood-opt active">🏖️</div>
                                <div class="mood-opt">💼</div>
                                <div class="mood-opt">🔥</div>
                            </div>
                            <div class="section-title" style="margin-left:0">心迹</div>
                            <div class="text-input">写下此刻的思绪...</div>
                            <div class="section-title" style="margin-left:0">影像</div>
                            <div class="photo-section">
                                <div class="photo-add">+</div>
                            </div>
                        </div>
                        <div class="save-fab">保存这一页</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 方案 C -->
        <div>
            <div class="label-tag">方案 C：叙事流</div>
            <div class="phone-mockup style-c">
                <div class="screen">
                    <div class="nav-bar">记录时刻</div>
                    <div class="timeline-wrapper">
                        <div class="vertical-line"></div>
                        <div class="flow-item">
                            <div class="marker"></div>
                            <div class="content">
                                <div class="f-time">21:40:48</div>
                                <div class="f-title">当前位置</div>
                                <div style="font-size:13px; color:#888">📍 正在获取地址...</div>
                            </div>
                        </div>
                        <div class="flow-item">
                            <div class="marker"></div>
                            <div class="content">
                                <div class="f-title">此刻心情</div>
                                <div class="f-mood">🏖️</div>
                            </div>
                        </div>
                        <div class="flow-item">
                            <div class="marker"></div>
                            <div class="content">
                                <div class="f-title">心语</div>
                                <div class="f-note">记录这一刻的想法...</div>
                            </div>
                        </div>
                        <div class="flow-item">
                            <div class="marker"></div>
                            <div class="content">
                                <div class="f-title">影集</div>
                                <div class="f-photo">+</div>
                            </div>
                        </div>
                    </div>
                    <div class="bottom-save">珍藏此刻</div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
