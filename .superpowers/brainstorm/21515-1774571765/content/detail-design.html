<h2>详情编辑页设计预览</h2>
<p class="subtitle">打卡成功后，自动跳转至此页面完善记录</p>

<div class="mockup">
  <div class="mockup-header">编辑记录</div>
  <div class="mockup-body" style="padding: 15px; background: #f8f8f8;">
    <!-- 顶部状态栏：自动获取的信息 -->
    <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #eee;">
      <div style="display: flex; align-items: center; margin-bottom: 5px;">
        <span style="font-size: 14px; color: #666; width: 60px;">时间</span>
        <span style="font-size: 14px; font-weight: 500;">2024-05-20 13:14:00</span>
      </div>
      <div style="display: flex; align-items: center;">
        <span style="font-size: 14px; color: #666; width: 60px;">地点</span>
        <span style="font-size: 14px; color: #07c160; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">北京市朝阳区三里屯...</span>
      </div>
    </div>

    <!-- 心情选择 -->
    <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #eee;">
      <div class="label" style="margin-bottom: 10px;">此刻心情</div>
      <div style="display: flex; justify-content: space-between;">
        <span style="font-size: 24px; padding: 5px; border: 2px solid #07c160; border-radius: 50%;">😊</span>
        <span style="font-size: 24px; padding: 5px; border: 2px solid transparent;">😢</span>
        <span style="font-size: 24px; padding: 5px; border: 2px solid transparent;">💼</span>
        <span style="font-size: 24px; padding: 5px; border: 2px solid transparent;">🏖️</span>
        <span style="font-size: 24px; padding: 5px; border: 2px solid transparent;">🔥</span>
      </div>
    </div>

    <!-- 文字笔记 -->
    <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #eee;">
      <div class="label" style="margin-bottom: 5px;">笔记内容</div>
      <textarea class="mock-input" style="height: 100px; width: 100%; border: none; padding: 5px;" placeholder="记录这一刻的想法..."></textarea>
    </div>

    <!-- 图片上传 -->
    <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #eee;">
      <div class="label" style="margin-bottom: 10px;">添加照片 (最多3张)</div>
      <div style="display: flex; gap: 10px;">
        <div style="width: 60px; height: 60px; background: #eee; border-radius: 4px; display: flex; align-items: center; justify-content: center; position: relative;">
          <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?w=100&h=100&fit=crop" style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;">
        </div>
        <div style="width: 60px; height: 60px; border: 1px dashed #ccc; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;">
          <span style="font-size: 20px; color: #999;">+</span>
        </div>
      </div>
    </div>

    <!-- 标签选择 -->
    <div style="background: white; padding: 12px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #eee;">
      <div class="label" style="margin-bottom: 8px;">标签</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <span style="background: #e1f5fe; color: #0288d1; padding: 4px 10px; border-radius: 12px; font-size: 12px;">#工作</span>
        <span style="background: #f1f8e9; color: #558b2f; padding: 4px 10px; border-radius: 12px; font-size: 12px;">#生活</span>
        <span style="background: #fff3e0; color: #ef6c00; padding: 4px 10px; border-radius: 12px; font-size: 12px;">#旅行</span>
        <span style="background: #f3f3f3; color: #999; padding: 4px 10px; border-radius: 12px; font-size: 12px;">+ 自定义</span>
      </div>
    </div>

    <button class="mock-button" style="background: #07c160; color: white; width: 100%; height: 44px; font-size: 16px;">保存记录</button>
  </div>
</div>
